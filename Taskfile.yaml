# https://taskfile.dev

version: '3'

includes:
  src:
    taskfile: taskfiles/sources.yaml
    vars:
      REPOS:
        ref: .REPOS
  build:
    taskfile: taskfiles/build.yaml
    flatten: true # prevent to have "build:build:<task>" task names
    vars:
      REPOS:
        ref: .REPOS
  deploy:
    taskfile: taskfiles/deployment.yaml
    vars:
      REPOS:
        ref: .REPOS
  test:
    taskfile: taskfiles/testing.yaml
    vars:
      CLIENTS:
        ref: .CLIENTS
      GREP_CMD:
        ref: .GREP_CMD

vars:
  # Repo names for the source repositories
  REPOS: [server, cli-go, cli-js]
  # Map of clients for each programming language and the path to its executable
  CLIENTS:
    map:
      go:
        cmd: "./crypto-broker-cli-go/bin/go-client-cli"
      js:
        cmd: "./crypto-broker-cli-js/bin/js-client-cli"
  # GNU grep support depending on OS
  GREP_CMD:
    sh: |
      case "$(uname)" in
        Darwin*) echo ggrep ;;
        Linux*) echo grep ;;
      esac

tasks:
  ################# Root Utility Tasks ####################
  default:
    desc: "Display all available tasks with descriptions"
    cmds:
      - task -l

  check-prerequisites:
    desc: "Verify all required tools are available (go, node, npm, git, cf, docker)"
    silent: true
    cmds:
      - |
        echo "[📋] Checking prerequisites..."
        MISSING=0
        for cmd in go node npm git cf docker; do
          if ! command -v $cmd &> /dev/null; then
            echo "[❌] Missing: $cmd"
            MISSING=$((MISSING+1))
          else
            echo "[✅] Found: $cmd"
          fi
        done
        if [ $MISSING -gt 0 ]; then
          echo "[❌] $MISSING prerequisite(s) missing"
          exit 1
        fi
        echo "[✅] All prerequisites found"

  initial-setup:
    desc: "First-time setup: clone all source repos and build the server and both CLI clients"
    vars:
      REPOS:
        ref: .REPOS
    cmds:
      - for: { var: REPOS }
        task: src:clone:{{.ITEM}}
      - task: build:all
