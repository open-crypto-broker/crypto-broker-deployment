apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-broker.fullname" . }}
  labels:
    {{- include "kube-broker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-broker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kube-broker.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # CLI-test apps (functional test clients)
        {{- range .Values.cliTestApps }}
        - name: {{ .name }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ .image }}:{{ $.Values.imageTag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          {{- with .args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "kube-broker.volumeMounts" $ | nindent 12 }}
        {{- end }}

        # Crypto-broker server (the broker)
        - name: {{ .Values.server.name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.server.image }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "kube-broker.fullname" . }}-serverconfig
          env:
            - name: GODEBUG
              value: {{ .Values.server.goDebug | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "kube-broker.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "kube-broker.volumes" . | nindent 8 }}
