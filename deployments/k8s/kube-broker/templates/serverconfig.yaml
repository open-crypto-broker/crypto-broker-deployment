apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-broker.fullname" . }}-serverconfig
  labels:
    {{- include "kube-broker.labels" . | nindent 4 }}
data:
  # Directory the server reads profiles from; baked into the server image.
  CRYPTO_BROKER_PROFILES_DIR: {{ .Values.server.profilesDir | quote }}
