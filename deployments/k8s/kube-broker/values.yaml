# Default values for the kube-broker chart.
# Deploys the crypto-broker server together with Go/JS test clients (and an
# optional stress-test runner) in a single pod for integration testing.

# Tag shared by the server, client and stress images in this deployment.
imageTag: dev

# Pull policy shared by all images in the chart.
imagePullPolicy: IfNotPresent

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

server:
  name: crypto-broker-server
  image: ghcr.io/open-crypto-broker/server
  profilesDir: /app/profiles
  goDebug: fips140=only # runtime flag for FIPS140 compliance

# Functional test clients exercised against the server over the shared socket.
# Each entry becomes a container in the pod (skipped when cliStressApp.enabled is true).
cliTestApps:
  - name: cli-js-hash
    image: ghcr.io/open-crypto-broker/test_app_js
    args:
      - --loop=1000
      - hash-data
      - --profile=Default
      - "𝒮ℴ𝓂ℯ 𝒶𝓇𝒷𝒾𝓉𝓇𝒶𝓇𝓎 𝒷𝓎𝓉ℴ𝓈 𝓉ℴ 𝒽𝒶𝓈𝒽"
  - name: cli-js-sign
    image: ghcr.io/open-crypto-broker/test_app_js
    args:
      - --loop=1000
      - sign-certificate
      - --profile=Default
      - --csr=/certificates/end-entity.csr
      - --caCert=/certificates/ca_cert.pem
      - --caKey=/certificates/private_key.pem
  - name: cli-js-encrypt
    image: ghcr.io/open-crypto-broker/test_app_js
    args:
      - --loop=1000
      - encrypt-data
      - --profile=Default
      - --keyRaw=67e1befda6538f162a308bb37b922441bed6e27039a26a48ad8e11c568c4cda0
      - --nonce=a83f89b37c90f937b8df5011
      - --aad=36e02c2a81c60eca849739d52dea95f7
      - Welcome CryptoBroker
  - name: cli-js-decrypt
    image: ghcr.io/open-crypto-broker/test_app_js
    args:
      - --loop=1000
      - decrypt-data
      - --profile=Default
      - --keyRaw=67e1befda6538f162a308bb37b922441bed6e27039a26a48ad8e11c568c4cda0
      - --nonce=a83f89b37c90f937b8df5011
      - --aad=36e02c2a81c60eca849739d52dea95f7
      - --tag=a77b42e960d89683140cae283a87466e
      - 71416b876fb0d65c484ec20106af15a36454743b
  - name: cli-go-hash
    image: ghcr.io/open-crypto-broker/test_app_go
    args:
      - --loop=1000
      - hash-data
      - --profile=Default
      - "𝒮ℴ𝓂ℯ 𝒶𝓇𝒷𝒾𝓉𝓇𝒶𝓇𝓎 𝒷𝓎𝓉ℴ𝓈 𝓉ℴ 𝒽𝒶𝓈𝒽"
  - name: cli-go-sign
    image: ghcr.io/open-crypto-broker/test_app_go
    args:
      - --loop=1000
      - sign-certificate
      - --profile=Default
      - --csr=/certificates/end-entity.csr
      - --caCert=/certificates/ca_cert.pem
      - --caKey=/certificates/private_key.pem
  - name: cli-go-encrypt
    image: ghcr.io/open-crypto-broker/test_app_go
    args:
      - --loop=1000
      - encrypt-data
      - --profile=Default
      - --keyRaw=67e1befda6538f162a308bb37b922441bed6e27039a26a48ad8e11c568c4cda0
      - --nonce=a83f89b37c90f937b8df5011
      - --aad=36e02c2a81c60eca849739d52dea95f7
      - Welcome CryptoBroker
  - name: cli-go-decrypt
    image: ghcr.io/open-crypto-broker/test_app_go
    args:
      - --loop=1000
      - decrypt-data
      - --profile=Default
      - --keyRaw=67e1befda6538f162a308bb37b922441bed6e27039a26a48ad8e11c568c4cda0
      - --nonce=a83f89b37c90f937b8df5011
      - --aad=36e02c2a81c60eca849739d52dea95f7
      - --tag=a77b42e960d89683140cae283a87466e
      - 71416b876fb0d65c484ec20106af15a36454743b

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
