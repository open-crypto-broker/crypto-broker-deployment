# https://taskfile.dev

version: '3'

vars:
  # Test apps for deployment
  APPS: [cli-go, cli-js]
  # Docker compose commands
  DOCKER_CMDS: [build, up, down]
  # Docker deployment targets
  DOCKER_TARGETS: [grafana, jaeger]
  # OpenTelemetry Collector configuration
  OTEL_VERSION: 0.145.0
  OTEL_DIST: otelcol
  OTEL_URL: https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{.OTEL_VERSION}}/{{.OTEL_DIST}}_{{.OTEL_VERSION}}_linux_amd64.tar.gz
  OTEL_SHA256: b877c1886e8e41d496f294c7e8c38d85b9db79a97b4e8ee80e36ac67dff9a4de

tasks:
  ################# Cloud Foundry Deployment ####################
  cf-push:*:
    desc: "Deploy to Cloud Foundry the Crypto Broker server and the specified client"
    preconditions:
      - sh: test -d crypto-broker-server/.git
        msg: "Crypto Broker server repo is not cloned and built — run 'task src:clone:server' and 'task build:server' first."
      - sh: test -d crypto-broker-{{.APP}}/.git
        msg: "Specified repo is not cloned and built — run 'task src:clone:*' and 'task build:*' first."
    vars:
      APP: '{{index .MATCH 0}}'
    requires:
      vars:
        - name: APP
          enum:
            ref: .APPS
    dotenv: ["../crypto-broker-server/.env"]
    cmds:
      - task: delete-deployment-folder
        vars:
          APP: '{{.APP}}'
      - task: create-deployment-folder
        vars:
          APP: '{{.APP}}'
      - task: copy-crypto-broker-server
        vars:
          APP: '{{.APP}}'
      - task: copy-test-certificates
        vars:
          APP: '{{.APP}}'
      - task: copy:{{.APP}}
        vars:
          APP: '{{.APP}}'
      - task: copy-otel-collector
        vars:
          APP: '{{.APP}}'
      - cf push --random-route
        --var go_debug=$FIPS_GODEBUG_VALUE
        -f deployments/cloud-foundry/{{.APP}}/manifest.yaml
        -p deployments/cloud-foundry/{{.APP}}/{{.APP}}-deployment/

  cf-delete:*:
    desc: "Delete the deployment folders and also on Cloud Foundry the deployment of Crypto Broker server and the specified client"
    vars:
      APP: '{{index .MATCH 0}}'
    requires:
      vars:
        - name: APP
          enum:
            ref: .APPS
    cmds:
        - task: delete-deployment-folder
          vars:
            APP: '{{.APP}}'
        - cf delete -r -f crypto-broker-{{.APP}}

  # Internal tasks for deployment to Cloud Foundry
  create-deployment-folder:
    desc: "Create the deployment folder for Cloud Foundry"
    internal: true
    cmds:
      - mkdir deployments/cloud-foundry/{{.APP}}/{{.APP}}-deployment

  delete-deployment-folder:
    desc: "Delete the deployment folder for Cloud Foundry"
    internal: true
    cmds:
      - rm -rf deployments/cloud-foundry/{{.APP}}/{{.APP}}-deployment

  copy-crypto-broker-server:
    desc: "Copy Crypto Broker server files to deployment folder"
    internal: true
    cmds:
      - cp crypto-broker-server/bin/crypto-broker-server deployments/cloud-foundry/{{.APP}}/{{.APP}}-deployment/
      - cp testing/profiles/Profiles.yaml deployments/cloud-foundry/{{.APP}}/{{.APP}}-deployment/

  copy:*:
    desc: "Copy the binary client files for Cloud Foundry deployment"
    internal: true
    cmds:
      - cp crypto-broker-{{.APP}}/bin/* deployments/cloud-foundry/{{.APP}}/{{.APP}}-deployment/

  copy-test-certificates:
    desc: "Copy test CSR and test CA certificate and CA private key to Cloud Foundry"
    internal: true
    cmds:
      - cp -r testing/certificates deployments/cloud-foundry/{{.APP}}/{{.APP}}-deployment/

  download-otel-collector:
    desc: "Download and extract the OpenTelemetry Collector binary"
    internal: true
    status:
      - test -f "deployments/cloud-foundry/otel-collector/bin/otelcol"
    cmds:
      - curl -L {{.OTEL_URL}} -o otelcol.tar.gz
      - echo "{{.OTEL_SHA256}}  otelcol.tar.gz" | sha256sum -c -
      - mkdir -p deployments/cloud-foundry/otel-collector/bin
      - tar -xzf otelcol.tar.gz -C deployments/cloud-foundry/otel-collector/bin
      - chmod +x deployments/cloud-foundry/otel-collector/bin/otelcol
      - rm otelcol.tar.gz

  copy-otel-collector:
    desc: "Copy the OpenTelemetry Collector and its configuration file to the deployment folder"
    deps: [download-otel-collector]
    internal: true
    cmds:
      - cp deployments/cloud-foundry/otel-collector/bin/otelcol deployments/cloud-foundry/{{.APP}}/{{.APP}}-deployment/
      - cp deployments/cloud-foundry/otel-collector/otel-config.yaml deployments/cloud-foundry/{{.APP}}/{{.APP}}-deployment/

  ################# Kubernetes Deployment ####################
  kube:up:
    desc: "Deploys the Kubernetes Crypto Broker"
    dir: deployments/k8s/kube-broker/
    vars:
      TAG: '{{.TAG | default "dev"}}'
    dotenv: ["../../../crypto-broker-server/.env"]
    cmds:
      - helm upgrade --install -f Chart.yaml -f values.yaml
          --set imageTag="{{.TAG}}"
          --set server.goDebug="$FIPS_GODEBUG_VALUE"
          crypto-broker --namespace crypto-broker --create-namespace .

  kube:down:
    desc: "Destroys the Kubernetes Crypto Broker deployment"
    cmds:
      - helm uninstall crypto-broker -n crypto-broker

  kube:build:*:
    desc: "Build the Docker images for the Kubernetes deployment"
    vars:
      REPO: '{{index .MATCH 0}}'
      TAG: '{{.TAG | default "dev"}}'
    requires:
      vars:
        - name: REPO
          enum:
            ref: .REPOS
    dir: crypto-broker-{{.REPO}}
    dotenv: ["../crypto-broker-{{.REPO}}/.env"]
    cmds:
      - test -f .env || task copy-env
      - task build-docker

  kube:load:*:
    desc: "Load the Docker images into minikube"
    vars:
      REPO: '{{index .MATCH 0}}'
      TAG: '{{.TAG | default "dev"}}'
    requires:
      vars:
        - name: REPO
          enum: [server, test_app_go, test_app_js]
    cmds:
      - minikube image load ghcr.io/open-crypto-broker/{{.REPO}}:{{.TAG}}

  ################# Docker-Compose Deployment ####################
  docker:*:*:
    desc: "Build, deploy or destroy Crypto Broker docker images for the specified target. Optionally set an image tag with TAG=...)"
    dir: deployments/docker/{{.TARGET}}/
    vars:
      TARGET: '{{index .MATCH 0}}'
      CMD: '{{index .MATCH 1}}'
      TAG: '{{.TAG | default "dev"}}'
    requires:
      vars:
        - name: TARGET
          enum:
            ref: .DOCKER_TARGETS
        - name: CMD
          enum:
            ref: .DOCKER_CMDS
    dotenv: ["../../../crypto-broker-server/.env"]
    cmds:
      - TAG={{.TAG}}
          docker compose -f {{.TARGET}}.yaml
          -f crypto-broker-server.yaml
          -f test_app_js.yaml
          -f test_app_go.yaml {{.CMD}}
